{% extends 'base.html' %}
{% load humanize %}

{% block content %}

<h2>Productos</h2>

<a href="{% url 'agregar_producto' %}" class="btn btn-primary mb-3">
    ➕ Agregar Producto
</a>

<form method="GET" class="mb-3">
    <input type="text" name="q" placeholder="Buscar producto..." class="form-control w-25 d-inline">
    <button class="btn btn-secondary">Buscar</button>
</form>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        {% for p in productos %}
        <tr>
            <td>{{ p.nombre }}</td>
            <td>{{ p.tipo }}</td>
            <td>${{ p.precio|floatformat:0 }}.000</td>
            <td>{{ p.stock }}</td>

            <td>
                <a href="{% url 'editar_producto' p.id %}" class="btn btn-warning btn-sm px-3">✏️</a>

                <a href="{% url 'eliminar_producto' p.id %}" 
                    class="btn btn-danger btn-sm px-3"
                    onclick="return confirm('¿Eliminar producto?')">🗑️</a>

                <a href="{% url 'cambiar_stock' p.id %}" 
                    class="btn btn-info btn-sm px-3">📦</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No hay productos</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
