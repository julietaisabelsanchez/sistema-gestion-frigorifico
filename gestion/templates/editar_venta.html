{% extends 'base.html' %}

{% block content %}

<div style="
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
    padding: 20px;
">

    <div style="
        width: 800px;
        background: white;
        border-radius: 25px;
        padding: 40px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    ">

        <div style="text-align:center; margin-bottom:30px;">
            <h1 style="color:#0d6efd; font-size:50px; font-weight:bold;">
                ✏️ Editar Venta
            </h1>
            <p style="color:#6c757d; font-size:20px;">
                Modificá los datos de la venta seleccionada
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom:20px;">
                <label style="font-weight:bold; font-size:20px;">👤 Cliente</label>
                <select name="cliente" class="form-control form-control-lg">
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id }}"
                        {% if cliente.id == venta.cliente.id %}selected{% endif %}>
                        {{ cliente.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:bold; font-size:20px;">📦 Producto</label>
                <select name="producto" class="form-control form-control-lg">
                    {% for producto in productos %}
                    <option value="{{ producto.id }}"
                        {% if detalle.producto.id == producto.id %}selected{% endif %}>
                        {{ producto.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="display:flex; gap:20px; margin-bottom:20px;">
                <div style="flex:1;">
                    <label style="font-weight:bold; font-size:20px;">🔢 Cantidad</label>
                    <input type="number"
                           name="cantidad"
                           value="{{ detalle.cantidad }}"
                           class="form-control form-control-lg"
                           required>
                </div>

                <div style="flex:1;">
                    <label style="font-weight:bold; font-size:20px;">💰 Total</label>
                    <input type="number"
                           step="0.01"
                           name="total"
                           value="{{ detalle.subtotal }}"
                           class="form-control form-control-lg"
                           required>
                </div>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:bold; font-size:20px;">📅 Fecha</label>
                <input type="date"
                       name="fecha"
                       value="{{ venta.fecha|date:'Y-m-d' }}"
                       class="form-control form-control-lg"
                       required>
            </div>

            <div style="margin-bottom:30px;">
                <label style="font-weight:bold; font-size:20px;">🧾 Comprobante</label>
                <input type="text"
                       name="comprobante"
                       value="{{ venta.numero_comprobante }}"
                       class="form-control form-control-lg"
                       required>
            </div>

            <div style="display:flex; justify-content:space-between; margin-top:30px;">
                <button type="submit"
                        class="btn btn-success btn-lg px-5">
                    💾 Guardar cambios
                </button>

                <a href="{% url 'ventas' %}"
                   class="btn btn-secondary btn-lg px-5">
                    ← Volver
                </a>
            </div>

        </form>
    </div>
</div>

{% endblock %}
