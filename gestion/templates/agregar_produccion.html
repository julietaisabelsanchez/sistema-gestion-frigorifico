{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">📦 Agregar Producción</h2>

<div class="card p-4 shadow-sm" style="max-width:600px;">
    {% if errors %}
    <div class="alert alert-danger">
        <ul class="mb-0">
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Producto</label>
            <select name="producto" class="form-control" required>
                <option value="">Seleccione un producto</option>
                {% for producto in productos %}
                    <option value="{{ producto.id }}" {% if data.producto == producto.id|stringformat:'s' %}selected{% endif %}>{{ producto.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Fecha</label>
            <input type="date" name="fecha" class="form-control" value="{{ data.fecha }}" required>
        </div>

        <div class="mb-3">
            <label>Cantidad producida</label>
            <input type="number" name="cantidad" class="form-control" min="1" value="{{ data.cantidad }}" required>
        </div>

        <button class="btn btn-success w-100">Registrar producción</button>
    </form>
</div>

{% endblock %}
