<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Recuperar contraseña</title>
  <style>
    body{margin:0;font-family:Inter,Segoe UI,Arial;background:linear-gradient(180deg,#0b1220,#071023);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{width:420px;background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.6);text-align:left}
    h2{margin:0 0 10px;text-align:center}
    p.lead{text-align:center;color:#64748b}
    input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #e6e9ee}
    button{margin-top:12px;width:100%;padding:12px;border-radius:10px;border:none;background:#06b6d4;color:#052022;font-weight:700}
    .meta{text-align:center;margin-top:12px}
    .meta a{color:#0ea5a4;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>Recuperar contraseña</h2>
    <p class="lead">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
    <form method="post">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Correo" required>
      <button type="submit">Enviar enlace</button>
    </form>
    <div class="meta"><a href="/login/">Volver al login</a></div>
  </div>
</body>
</html>
