{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h2>✏️ Editar Movimiento</h2>

    <form method="POST" class="card shadow p-4">
        {% csrf_token %}

        <div class="mb-3">
            <label>Cliente</label>
            <select name="cliente" class="form-select">
                {% for c in clientes %}
                <option value="{{ c.id }}" {% if movimiento.cliente.id == c.id %}selected{% endif %}>
                    {{ c.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <input type="text" name="descripcion" class="form-control"
                   value="{{ movimiento.descripcion }}">
        </div>

        <div class="mb-3">
            <label>Cajas</label>
            <input type="number" name="cajas" class="form-control"
                   value="{{ movimiento.cajas }}">
        </div>

        <div class="mb-3">
            <label>Precio Unitario</label>
            <input type="number" step="0.01" name="precio_unitario"
                   class="form-control"
                   value="{{ movimiento.precio_unitario }}">
        </div>

        <div class="mb-3">
            <label>Cobro</label>
            <input type="number" step="0.01" name="pago"
                   class="form-control"
                   value="{{ movimiento.pago }}">
        </div>

        <button type="submit" class="btn btn-success">
            💾 Guardar Cambios
        </button>

    </form>

</div>
{% endblock %}
