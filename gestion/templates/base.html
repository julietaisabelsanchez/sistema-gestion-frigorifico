<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión</title>

    {% load static %}

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TU CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #1f2937;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar h4 {
            margin-bottom: 20px;
        }

        .menu {
            list-style: none;
            padding: 0;
            flex: 1;
        }

        .menu li {
            margin-bottom: 10px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #374151;
        }

        /* LOGOUT ABAJO */
        .logout {
            margin-top: auto;
        }

        .logout a {
            color: #ff6b6b;
            font-weight: bold;
        }

        /* CONTENIDO */
        .content {
            flex: 1;
            padding: 20px;
        }

        .titulo {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h4>📊 Sistema</h4>

        <ul class="menu">
            <li><a href="{% url 'dashboard' %}">📊 Dashboard</a></li>
            <li><a href="{% url 'productos' %}">📦 Productos</a></li>
            <li><a href="{% url 'clientes' %}">👥 Clientes</a></li>
            <li><a href="{% url 'ventas' %}">💰 Ventas</a></li>
            <li><a href="{% url 'empleados' %}">👨‍💼 Empleados</a></li>
            <li><a href="{% url 'envios' %}">🚚 Envíos</a></li>
            <li><a href="{% url 'stock_grasas_cajas' %}">📦 Stock</a></li>
            <a href="{% url 'deudas' %}" class="nav-link">📉 Deudas</a>
        </ul>

        <!-- 🔥 LOGOUT ABAJO -->
        <div class="logout">
            <a href="{% url 'logout' %}">
                🚪 Cerrar sesión
            </a>
        </div>

    </aside>

    <!-- CONTENIDO -->
    <main class="content w-100">

        <!-- MENSAJES -->
        {% if messages %}
            <div class="p-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        

        <!-- CONTENIDO DINÁMICO -->
        {% block content %}
        {% endblock %}

    </main>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
