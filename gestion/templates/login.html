<!DOCTYPE html>
<html lang="es">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <title>Login - Frigorífico</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1f2937, #111827);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: white;
      padding: 35px 25px;
      border-radius: 15px;
      width: 300px;
      text-align: center;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.4);
    }

    .logo {
      width: 150px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-login { background: #4CAF50; color: white; }
    .btn-register { background: #2196F3; color: white; }

    #mensaje {
      margin-top: 15px;
      font-size: 20px;
      color: red;
    }
  </style>
</head>

<body>

<div class="login-container">

 <img src="{% static 'logo.png' %}" class="logo">

  <h2>Iniciar Sesión</h2>

  <input type="text" id="email" placeholder="Correo">

  <div style="position: relative;">
    <input type="password" id="password" placeholder="Contraseña" style="padding-right: 10px;">

    <span id="icono" onclick="togglePassword()" 
          style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
      👁
    </span>
  </div>

  <button class="btn-login" onclick="login()">Ingresar</button>
  <button class="btn-register" onclick="register()">Registrarse</button>

  <a href="#" onclick="resetPassword()">¿Olvidaste tu contraseña?</a>

  <p id="mensaje"></p>

</div>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyBQrgT9yh_pWf1BA8ZucQkEuXSTu3mI2W0",
  authDomain: "frigorifico-221ba.firebaseapp.com",
  projectId: "frigorifico-221ba",
  storageBucket: "frigorifico-221ba.firebasestorage.app",
  messagingSenderId: "88394470433",
  appId: "1:88394470433:web:c821d159f50a246f187f60"
};

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function togglePassword() {
    const input = document.getElementById("password");
    const icono = document.getElementById("icono");

    if (input.type === "password") {
      input.type = "text";
      icono.innerText = "🙈";
    } else {
      input.type = "password";
      icono.innerText = "👁";
    }
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
      .then((userCredential) => userCredential.user.getIdToken())
      .then((token) => {
        return fetch("/verificar_token/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ token: token })
        });
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "ok") {
          window.location.href = "/";
        } else {
          document.getElementById("mensaje").innerText = data.mensaje;
        }
      })
      .catch(error => {
        console.log(error);
        document.getElementById("mensaje").innerText = error.message;
      });
  }

  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email, password)
      .then(() => {
        document.getElementById("mensaje").style.color = "green";
        document.getElementById("mensaje").innerText = "Usuario creado ✔";
      })
      .catch(error => {
        document.getElementById("mensaje").innerText = error.message;
      });
  }

  function resetPassword() {
    const email = document.getElementById("email").value;

    auth.sendPasswordResetEmail(email)
      .then(() => {
        document.getElementById("mensaje").style.color = "green";
        document.getElementById("mensaje").innerText = "📩 Revisá tu correo";
      })
      .catch(error => {
        document.getElementById("mensaje").innerText = error.message;
      });
  }
</script>

</body>
</html>
