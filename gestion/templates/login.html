<!DOCTYPE html>

<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Login - Frigorífico</title>

```
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1f2937, #111827);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        background: white;
        padding: 35px 25px;
        border-radius: 15px;
        width: 320px;
        text-align: center;
        box-shadow: 0px 10px 30px rgba(0,0,0,0.4);
    }

    .logo {
        width: 150px;
        margin-bottom: 30px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        background: #4CAF50;
        color: white;
    }

    .error {
        color: red;
        margin-top: 10px;
    }
</style>
```

</head>

<body>

<div class="login-container">

```
<img src="{% static 'logo.png' %}" class="logo">

<h2>Iniciar Sesión</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text"
           name="email"
           placeholder="Usuario"
           required>

    <input type="password"
           name="password"
           placeholder="Contraseña"
           required>

    <button type="submit">
        Ingresar
    </button>
</form>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}
```

</div>

</body>
</html>
