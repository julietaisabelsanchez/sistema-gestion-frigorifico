<h2>Factura #{{ factura.numero }}</h2>
<p>Cliente: {{ factura.cliente }}</p>
<p>Fecha: {{ factura.fecha }}</p>

<table>
<tr>
<th>Producto</th>
<th>Cantidad</th>
<th>Precio</th>
</tr>

{% for d in detalles %}
<tr>
<td>{{ d.producto.nombre }}</td>
<td>{{ d.cantidad }}</td>
<td>{{ d.precio }}</td>
</tr>
{% endfor %}
</table>

<h3>Total: ${{ factura.total }}</h3>

<button onclick="window.print()">Imprimir</button>
