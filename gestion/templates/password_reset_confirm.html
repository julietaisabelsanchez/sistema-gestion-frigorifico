<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Restablecer contraseña</title>
  <style>body{margin:0;font-family:Inter,Arial;background:linear-gradient(180deg,#0b1220,#071023);min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;padding:26px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.6);width:420px}h2{text-align:center}form input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #e6e9ee}button{margin-top:12px;width:100%;padding:12px;border-radius:10px;border:none;background:#06b6d4;color:#052022;font-weight:700}</style>
</head>
<body>
  <div class="card">
    <h2>Restablecer contraseña</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Cambiar contraseña</button>
    </form>
  </div>
</body>
</html>
