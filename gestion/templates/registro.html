<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <style>
    body{ margin:0; font-family:Inter, 'Segoe UI', Arial; background:linear-gradient(180deg,#0b1220,#071023); min-height:100vh; display:flex; align-items:center; justify-content:center }
    .card{ width:380px; background:#fff; padding:30px; border-radius:14px; box-shadow:0 10px 30px rgba(2,6,23,0.6); text-align:center }
    h2{ margin:4px 0 18px }
    input{ width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #e6e9ee }
    button{ width:100%; padding:12px; border-radius:10px; border:none; background:#06b6d4; color:#052022; font-weight:700; cursor:pointer }
    .msg{ margin-top:12px; padding:10px; border-radius:8px }
    .msg.error{ background:#fff0f0; color:#7f1d1d }
    .meta{ margin-top:12px; color:#64748b }
    .meta a{ color:#0ea5a4; text-decoration:none }
  </style>
</head>
<body>
  <div class="card">
    <h2>Crear cuenta</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% if error %}
      <div class="msg error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Correo electronico" value="{{ email|default:'' }}" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Crear cuenta</button>
    </form>

    <div class="meta">
      <a href="/login/">Ir al login</a>
    </div>
  </div>
</body>
</html>
